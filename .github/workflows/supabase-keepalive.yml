# Supabase 免費方案閒置 7 天會暫停：每日打一次資料庫。未登入會被 RLS 權限拒絕（42501），但請求已到 Postgres。
# 只在設了 repo variables SUPABASE_URL、SUPABASE_ANON_KEY 的 repo 執行（兩者都是前端公開值）。
name: Supabase keepalive

on:
  schedule:
    - cron: '17 19 * * *' # 台北 03:17
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          body=$(curl -sS --retry 3 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "$body" | cut -c1-120
          echo "$body" | grep -q '"code":"42501"' || [ "$body" = "[]" ]
