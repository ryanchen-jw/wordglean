project_name: "LinguaApp"
default_status: "To Do"
statuses: ["Deferred", "To Do", "In Progress", "In Review", "Done"]
labels: ["workspace", "app", "supabase", "content", "data"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
